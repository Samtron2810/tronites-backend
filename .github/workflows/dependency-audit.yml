name: Dependency audit

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # high/critical fails the job; moderate/low are visible in the log
      # without blocking, so this doesn't turn into constant CI noise.
      - run: npm audit --audit-level=high
